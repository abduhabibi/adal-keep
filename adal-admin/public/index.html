<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adal Keep Admin</title>
<style>
  :root { --bg:#f3f5f9; --panel:#fff; --panel2:#f8fafc; --line:#e5e9f0; --text:#0f1c2a; --muted:#64748b; --teal:#0d9488; --teal-d:#0f766e; --teal-soft:#e6f6f4; --red:#dc2626; --amber:#b45309; --mine:#d9f2ee; --green:#16a34a; --shadow:0 1px 2px #0f172a0d, 0 4px 14px #0f172a0a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1117; --panel:#121b23; --panel2:#0f171e; --line:#223039; --text:#e6eef3; --muted:#8ea3b0; --teal-soft:#10322f; --mine:#143a36; --shadow:none; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; overflow:hidden; }
  /* The menu */
  #menu { width:220px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #menu .brand { padding:18px 18px 14px; font-weight:800; font-size:16px; display:flex; gap:10px; align-items:center; }
  #menu .brand i { font-style:normal; width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,#14b8a6,#0f766e); color:#fff; display:grid; place-items:center; font-size:16px; }
  .tabs { display:flex; flex-direction:column; gap:2px; padding:6px 10px; }
  .tabs button { display:flex; gap:10px; align-items:center; border:0; background:transparent; color:var(--muted); padding:9px 12px; border-radius:10px; cursor:pointer; font:600 13.5px "Segoe UI", system-ui, sans-serif; text-align:left; }
  .tabs button span.ic { width:20px; text-align:center; font-size:15px; }
  .tabs button:hover { background:var(--panel2); color:var(--text); }
  .tabs button.on { background:var(--teal-soft); color:var(--teal-d); }
  @media (prefers-color-scheme: dark) { .tabs button.on { color:#5eead4; } }
  .tabs button .count { margin-left:auto; background:var(--red); color:#fff; border-radius:999px; font-size:11px; padding:0 7px; }
  #menu .foot { margin-top:auto; padding:12px 18px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); }
  #menu .foot a { color:var(--muted); }
  /* The list beside the chats */
  nav#side { width:300px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:none; flex-direction:column; min-height:0; }
  body.chats nav#side { display:flex; }
  nav#side header { padding:16px; font-weight:700; border-bottom:1px solid var(--line); }
  .list { overflow-y:auto; flex:1; }
  .item { padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:8px; align-items:center; }
  .item:hover, .item.on { background:var(--teal-soft); }
  .item .t { font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .s { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { background:var(--teal); color:#fff; border-radius:999px; font-size:11px; padding:1px 7px; font-weight:700; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  main > header { padding:16px 24px; background:var(--panel); border-bottom:1px solid var(--line); font-weight:700; font-size:15px; display:flex; gap:12px; align-items:center; min-height:58px; }
  main > header #title { flex:1; min-width:0; }
  #search { width:240px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font:13px "Segoe UI", system-ui, sans-serif; }
  #sync { font-size:11.5px; color:var(--muted); font-weight:500; white-space:nowrap; }
  #sync.off { color:var(--red); }
  #thread { flex:1; overflow-y:auto; padding:18px 24px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:70%; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 11px; align-self:flex-start; box-shadow:var(--shadow); }
  .msg.mine { align-self:flex-end; background:var(--mine); }
  .msg .who { font-size:11px; font-weight:700; color:var(--teal); }
  .msg .time { font-size:10px; color:var(--muted); text-align:right; }
  .msg img { max-width:260px; max-height:260px; border-radius:8px; display:block; margin-top:4px; cursor:zoom-in; }
  .msg .del { font-size:10px; color:var(--red); cursor:pointer; margin-left:8px; }
  form#compose { display:flex; gap:8px; padding:12px 24px; background:var(--panel); border-top:1px solid var(--line); }
  form#compose input[type=text] { flex:1; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--text); }
  button { font-family:inherit; }
  button.go { background:var(--teal); color:#fff; border:0; border-radius:10px; padding:9px 16px; font-weight:600; cursor:pointer; }
  button.go:hover { background:var(--teal-d); }
  button.ghost { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:7px 12px; cursor:pointer; font-weight:600; }
  button.ghost:hover { border-color:var(--teal); color:var(--teal); }
  button.danger { background:var(--red); color:#fff; border:0; border-radius:10px; padding:7px 12px; cursor:pointer; font-weight:600; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:var(--panel2); }
  .wrap { padding:20px 24px; overflow:auto; flex:1; }
  .code { font-family:ui-monospace, Consolas, monospace; font-weight:700; letter-spacing:.12em; }
  .pill { font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; display:inline-block; }
  .pending { background:#fef3c7; color:var(--amber); } .approved { background:#d1fae5; color:#047857; } .rejected { background:#fee2e2; color:var(--red); }
  .muted { color:var(--muted); }
  #dlg { position:fixed; inset:0; background:#0009; display:none; align-items:center; justify-content:center; z-index:50; }
  #dlg .box { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:min(440px,92vw); box-shadow:0 20px 60px #0004; }
  #dlg h3 { margin:0 0 6px; } #dlg p { margin:0 0 14px; color:var(--muted); }
  #dlg input { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); margin-bottom:12px; }
  #dlg .row { display:flex; gap:8px; justify-content:flex-end; }
  .addform { display:grid; grid-template-columns:140px 1fr auto auto; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:16px; box-shadow:var(--shadow); }
  .addform input[type=text] { padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); }
  h4 { margin:20px 0 10px; font-size:14px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:var(--shadow); }
  .card b { font-size:26px; display:block; letter-spacing:-.02em; } .card span { color:var(--muted); font-size:12px; }
  .card.warn b { color:var(--amber); } .card.bad b { color:var(--red); }
  tr.ag { cursor:pointer; } tr.ag:hover, tr.ag.on { background:var(--teal-soft); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:#94a3b8; } .dot.on { background:var(--green); box-shadow:0 0 0 3px #16a34a26; }
  .num.warn { color:var(--amber); font-weight:700; } .num.bad { color:var(--red); font-weight:700; }
  .detail { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; margin-top:14px; }
  .box2 { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; min-width:0; box-shadow:var(--shadow); }
  .box2 h4 { margin:0 0 10px; } .row2 { display:flex; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .row2:last-child { border:0; } .row2 .grow { flex:1; min-width:0; } .row2 .why { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stages { display:flex; flex-wrap:wrap; gap:6px; } .stages span { background:var(--teal-soft); color:var(--teal-d); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  #ceoT input { width:100%; min-width:130px; padding:7px 9px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); }
  .needs { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:14px; padding:12px 16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .needs h4 { margin:0 0 6px; } .needs div { padding:3px 0; font-size:13px; cursor:pointer; } .needs div:hover { color:var(--teal); }
  .agwrap { display:grid; grid-template-columns:minmax(260px,330px) 1fr; gap:16px; align-items:start; } @media (max-width:900px) { .agwrap { grid-template-columns:1fr; } }
  .aglist { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; position:sticky; top:0; }
  .drop { background:var(--panel); border:2px dashed var(--line); border-radius:14px; padding:12px; min-height:120px; } .drop.over { border-color:var(--teal); background:var(--teal-soft); }
  .drop h4 { margin:0; display:flex; gap:6px; align-items:center; } .plan { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin:6px 0; }
  .plan input { width:58px; } .chip { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:7px 9px; margin-top:6px; font-size:13px; }
  .chip[draggable=true] { cursor:grab; } .chip[draggable=true]:hover { border-color:var(--teal); } .chip b { display:block; } .chip small { color:var(--muted); display:block; overflow-wrap:anywhere; }
  .chip .x { float:right; background:none; border:0; color:var(--muted); cursor:pointer; }
  #zoom { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; cursor:zoom-out; z-index:60; }
  #zoom img { max-width:92vw; max-height:92vh; }
  /* Agencies: one card per PC */
  .agrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
  .acard { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s, transform .15s; }
  .acard:hover { border-color:var(--teal); transform:translateY(-1px); }
  .acard .top { display:flex; gap:10px; align-items:center; }
  .acard .av { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-weight:800; color:#fff; background:linear-gradient(135deg,#14b8a6,#0e7490); flex-shrink:0; }
  .acard .nm { font-weight:700; font-size:15px; } .acard .sub { font-size:12px; color:var(--muted); }
  .acard .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px; }
  .acard .nums div { background:var(--panel2); border-radius:10px; padding:8px; text-align:center; } .acard .nums b { display:block; font-size:17px; } .acard .nums span { font-size:11px; color:var(--muted); }
  .plantag { margin-left:auto; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--teal-soft); color:var(--teal-d); text-transform:uppercase; letter-spacing:.04em; }
  .plantag.basic { background:#e0e7ff; color:#3730a3; } .plantag.standard { background:#dbeafe; color:#1d4ed8; } .plantag.premium { background:#fef3c7; color:#92400e; }
  .apage .head { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .apage .head .av { width:56px; height:56px; border-radius:16px; font-size:22px; }
  .apage .acts { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; } .kv span { color:var(--muted); }
  .tags { display:flex; flex-wrap:wrap; gap:6px; } .tags span { background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:12px; }
  .wait { border-left:3px solid var(--amber); }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 18px; border-radius:12px; font-size:13px; box-shadow:0 10px 30px #0005; display:none; z-index:70; max-width:80vw; }
</style>
</head>
<body>
<aside id="menu">
  <div class="brand"><i>A</i> Adal Keep Admin</div>
  <div class="tabs">
    <button data-tab="work" class="on"><span class="ic">🏠</span>Home</button>
    <button data-tab="agencies"><span class="ic">🏢</span>Agencies</button>
    <button data-tab="inbox"><span class="ic">💬</span>Inbox</button>
    <button data-tab="payments"><span class="ic">💳</span>Payments</button>
    <button data-tab="plans"><span class="ic">⭐</span>Plans</button>
    <button data-tab="cvt"><span class="ic">📄</span>CV templates</button>
    <button data-tab="agents"><span class="ic">🤝</span>Agents</button>
    <button data-tab="ceos"><span class="ic">👤</span>CEOs</button>
    <button data-tab="chats"><span class="ic">🗨️</span>All chats</button>
  </div>
  <div class="foot">Only on this PC · <a href="/logout">Sign out</a></div>
</aside>
<nav id="side">
  <header id="sideT">Inbox</header>
  <div class="list" id="list"></div>
</nav>
<main>
  <header><span id="title">Home</span><input id="search" type="search" placeholder="Find an agency…" autocomplete="off"><span id="sync">…</span></header>
  <div id="thread"></div>
  <div class="wrap" id="table" style="display:none"></div>
  <form id="compose" style="display:none">
    <input type="file" id="pic" accept="image/*" hidden>
    <button type="button" class="ghost" onclick="pic.click()" title="Send a picture">📎</button>
    <input type="text" id="text" placeholder="Write to the agency… (links are not allowed)" autocomplete="off">
    <button class="go">Send</button>
  </form>
</main>
<div id="zoom" onclick="this.style.display='none'"><img alt=""></div>
<div id="dlg"><div class="box"><h3 id="dlgT"></h3><p id="dlgP"></p><input id="dlgI" type="text" style="display:none"><div class="row"><button class="ghost" id="dlgNo">Cancel</button><button class="go" id="dlgOk">OK</button></div></div></div>
<div id="toast"></div>
<script>
let data = { agencies: [], conversations: [], requests: [] }
let tab = 'work', open = null, lastId = 0, work = [], workOpen = null
let downloads = {}   // agency → its backup download to this PC
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const when = (t) => new Date(t).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })
const api = async (p, body) => {
  const r = await fetch(p, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
  // Signed out (12 hours passed, or the panel was set up again): back to the password.
  if (r.status === 401) { location.reload(); return new Promise(() => {}) }
  const text = await r.text()
  let j = {}; try { j = text ? JSON.parse(text) : {} } catch { throw new Error(`The panel answered ${r.status} without data`) }
  if (!r.ok) throw new Error(j.error || r.status)
  if (j && j.queued) toast(j.message || 'Its PC is off: it waits online and is done when the PC is on.')
  return j
}
// The panel's own questions: the browser's confirm() can be switched off
// ("Don't allow localhost:4100 to ask again") and then silently says No.
function ask({ title, text = '', ok = 'OK', danger = false, input = null }) {
  return new Promise(resolve => {
    $('#dlgT').textContent = title; $('#dlgP').textContent = text
    const I = $('#dlgI'); I.style.display = input === null ? 'none' : 'block'; I.value = input ?? ''
    const okB = $('#dlgOk'); okB.textContent = ok; okB.className = danger ? 'danger' : 'go'
    const done = (v) => { $('#dlg').style.display = 'none'; resolve(v) }
    okB.onclick = () => done(input === null ? true : I.value)
    $('#dlgNo').onclick = () => done(input === null ? false : null)
    $('#dlgNo').style.display = ok === 'Close' ? 'none' : ''
    $('#dlg').style.display = 'flex'
    ;(input === null ? okB : I).focus()
  })
}
const tell = (title, text) => ask({ title, text, ok: 'Close' })
const name = (id) => data.agencies.find(a => a.id === id)?.name || 'agency'
const img = (p) => `<img src="/api/image?path=${encodeURIComponent(p)}" onclick="event.stopPropagation(); zoom.querySelector('img').src=this.src; zoom.style.display='flex'">`

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  if (tab === b.dataset.tab && tab === 'agencies') pageOf = null
  tab = b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b))
  document.body.classList.toggle('chats', tab === 'inbox' || tab === 'chats')
  $('#sideT').textContent = tab === 'inbox' ? 'Inbox — your chat with each agency' : 'All chats'
  if (tab !== 'inbox' && tab !== 'chats') { $('#thread').style.display = 'none'; $('#compose').style.display = 'none' }
  if (tab === 'payments' || tab === 'agencies' || tab === 'work' || tab === 'agents' || tab === 'ceos' || tab === 'plans' || tab === 'cvt') { open = null; showTable() } else renderList()
  renderList()
})

function renderList() {
  const L = $('#list')
  if (tab === 'inbox' || tab === 'chats') {
    const mainIds = new Set((data.mains || []).map(m => m.id))
    const convs = data.conversations.filter(c => tab === 'inbox' ? c.kind === 'admin' && (!data.mains || mainIds.has(c.key.slice(6)) || c.unread) : c.kind !== 'admin')
    L.innerHTML = convs.map(c => `<div class="item ${open?.id === c.id ? 'on' : ''}" data-id="${c.id}">
      <div style="min-width:0;flex:1"><div class="t">${esc(c.title)}</div>
      <div class="s">${c.last ? esc(c.last.body || '📷 picture') : '<span class="muted">no messages yet</span>'}</div></div>
      ${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</div>`).join('') || '<p class="muted" style="padding:14px">Nothing yet.</p>'
    L.querySelectorAll('.item').forEach(el => el.onclick = () => openConv(data.conversations.find(c => c.id === el.dataset.id)))
  } else if (tab === 'work') {
    L.innerHTML = work.map(a => `<div class="item ${workOpen === a.id ? 'on' : ''}" data-w="${a.id}"><span class="dot ${a.pcOnline ? 'on' : ''}"></span>
      <div style="min-width:0;flex:1"><div class="t">${esc(a.name)}</div><div class="s">${a.summary ? `${a.summary.profiles} profiles · ${a.summary.runs.paused + a.summary.runs.pending} waiting` : 'no online copy yet'}</div></div>
      ${a.summary && (a.summary.runs.paused + a.summary.tasks.open) ? `<span class="badge">${a.summary.runs.paused + a.summary.tasks.open}</span>` : ''}</div>`).join('') || '<p class="muted" style="padding:14px">No agencies yet.</p>'
    L.querySelectorAll('[data-w]').forEach(el => el.onclick = () => { workOpen = el.dataset.w; showTable(); renderList() })
  } else if (tab === 'payments') {
    const p = data.requests.filter(r => r.status === 'pending').length
    L.innerHTML = `<p style="padding:14px">${p} receipt(s) waiting.</p>`
  } else {
    L.innerHTML = `<p style="padding:14px">${data.agencies.filter(a => !a.is_admin).length} agencies installed Adal Keep.</p>`
  }
}

async function openConv(c) {
  open = c; lastId = 0
  $('#title').textContent = c.title + (c.kind === 'admin' ? ' — inbox with Adal' : c.kind === 'group' ? ' — all agencies' : ' — private chat')
  $('#thread').style.display = 'flex'; $('#table').style.display = 'none'
  $('#compose').style.display = c.kind === 'direct' ? 'none' : 'flex' // Adal reads private chats, writes in inboxes and Everyone
  $('#thread').innerHTML = ''
  await loadMessages(); renderList()
}

async function loadMessages() {
  if (!open) return
  const list = await api(`/api/messages?conversation=${open.id}`)
  const T = $('#thread'), atBottom = T.scrollHeight - T.scrollTop - T.clientHeight < 60
  T.innerHTML = list.map(m => `<div class="msg ${m.sender_id === data.adminId ? 'mine' : ''}">
    <div class="who">${esc(m.sender_id === data.adminId ? 'You (Adal Keep)' : name(m.sender_id))}<span class="del" data-id="${m.id}">delete</span></div>
    ${m.body ? `<div>${esc(m.body)}</div>` : ''}${m.image_path ? img(m.image_path) : ''}
    <div class="time">${when(m.created_at)}</div></div>`).join('') || '<p class="muted">No messages yet.</p>'
  T.querySelectorAll('.del').forEach(d => d.onclick = async () => { if (await ask({ title: 'Delete this message?', text: 'It disappears for everyone.', ok: 'Delete', danger: true })) { await api('/api/delete-message', { id: d.dataset.id }); loadMessages() } })
  const newest = list.at(-1)?.id || 0
  if (atBottom || newest !== lastId) T.scrollTop = T.scrollHeight
  lastId = newest
}

// One agency's own Adal Keep, in its own window (served on :4101).
function openAgency(id, to = '') {
  const a = work.find(x => x.id === id) || data.agencies.find(x => x.id === id) || {}
  const url = `http://localhost:${Number(location.port) + 1}/?agency=${id}&name=${encodeURIComponent(a.name || '')}${to ? `&to=${encodeURIComponent(to)}` : ''}`
  window.open(url, `agency-${id}`, 'popup,width=1280,height=860')
}
const WF = { musaned_add_candidate: 'Musaned', musaned_check_chosen: 'Musaned check', wafid_book: 'Wafid booking', wafid_check: 'Wafid result', wafid_slip: 'Wafid slip',
  lmis_contract: 'LMIS contract', insurance_certificate: 'Insurance', mofa_visa: 'Visa', cv_generate: 'CV' }
const wf = (w) => WF[w] || String(w || '').replace(/_/g, ' ')
const ago = (t) => { if (!t) return '—'; const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? 'now' : m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d` }
const cls = (n, warn, bad) => n >= bad ? 'num bad' : n >= warn ? 'num warn' : 'num'

// What deserves Adal's eye first, worked out from every agency's summary.
function needsYou() {
  const out = []
  for (const a of work) {
    const s = a.summary, hrs = a.pcSeen ? (Date.now() - new Date(a.pcSeen)) / 3600000 : null
    const say = (rank, text) => out.push({ rank, id: a.id, text: `${a.name}: ${text}` })
    if (a.banned) continue
    if (!a.pcOnline && hrs !== null && hrs > 24) say(1, `PC off for ${hrs > 48 ? `${Math.round(hrs / 24)} days` : `${Math.round(hrs)} hours`}${s?.runs?.paused ? `, ${s.runs.paused} runs waiting` : ''}`)
    if (!s) { say(3, 'has sent no summary yet'); continue }
    for (const r of (s.reasons || []).filter(r => r.n >= 3)) say(2, `${r.n} runs failed this week: ${r.why}`)
    if (s.runs?.paused >= 5) say(3, `${s.runs.paused} runs are waiting for a person`)
    const soon = (s.medicals || []).filter(m => m.days <= 7).length
    if (soon) say(2, `${soon} medical${soon > 1 ? 's' : ''} ending within 7 days`)
    if (a.latest && a.health?.version?.sha && a.health.version.sha !== a.latest) say(4, `not on the newest version (${a.health.version.sha})`)
    if (s.agent_limit && (s.agents || []).length >= s.agent_limit) say(4, `has used all ${s.agent_limit} agents of its plan: time for a bigger offer?`)
  }
  return out.sort((x, y) => x.rank - y.rank).slice(0, 8)
}

      <h4 style="margin-top:14px">CV templates (${D.templates.length})</h4>
      ${D.templates.map((t, i) => `<div class="chip" draggable="true" data-tpl="${i}"><b>${esc(t.name)}</b><small>${esc(t.agencyName)}</small></div>`).join('') || '<p class="muted">None online yet.</p>'}

  const cards = [
    ['Agencies with PC on', `${work.filter(a => a.pcOnline).length} / ${work.length}`, ''],
    ['Runs waiting for a person', sum(s => s.runs.paused + s.runs.pending), sum(s => s.runs.paused) > 10 ? 'warn' : ''],
    ['Failed this week', sum(s => s.runs.failed7d), sum(s => s.runs.failed7d) ? 'bad' : ''],
    ['Open tasks', sum(s => s.tasks.open), ''],
    ['Medicals ending ≤ 7 days', sum(s => s.medicals.filter(m => m.days <= 7).length), sum(s => s.medicals.filter(m => m.days <= 7).length) ? 'bad' : ''],

  ]
  const needs = needsYou()
  let html = `${needs.length ? `<div class="needs"><h4>Needs you</h4>${needs.map(n => `<div data-need="${n.id}">${esc(n.text)}</div>`).join('')}</div>` : ''}<div class="cards">${cards.map(([t, v, c]) => `<div class="card ${c}"><b>${v}</b><span>${t}</span></div>`).join('')}</div>
    <table><tr><th>Agency</th><th>PC</th><th>Profiles</th><th>Chosen</th><th>Waiting</th><th>Failed 7 d</th><th>Tasks</th><th>Medical ≤ 14 d</th><th>Phones</th><th>Copied</th><th>Backup</th><th>Version</th><th></th></tr>` +
    work.map(a => { const s = a.summary; return `<tr class="ag ${workOpen === a.id ? 'on' : ''}" data-row="${a.id}">
      <td><b>${esc(a.name)}</b> <span class="muted code" style="letter-spacing:0">${esc(a.pc_number || '')}</span>${a.branchPCs?.length ? `<div class="muted" style="font-size:11px">+ ${a.branchPCs.length} PC(s) following it: ${a.branchPCs.join(', ')}</div>` : ''}${a.banned ? ' <span class="pill rejected">banned</span>' : ''}</td>
      <td><span class="dot ${a.pcOnline ? 'on' : ''}"></span>${a.pcOnline ? 'on' : `off ${a.pcSeen ? ago(a.pcSeen) : ''}`}</td>
      ${s ? `<td>${s.profiles}</td><td>${s.chosen}</td><td class="${cls(s.runs.paused + s.runs.pending, 5, 15)}">${s.runs.paused + s.runs.pending}</td>
      <td class="${cls(s.runs.failed7d, 1, 5)}">${s.runs.failed7d}</td><td class="${cls(s.tasks.open, 5, 20)}">${s.tasks.open}</td>
      <td class="${cls(s.medicals.length, 1, 3)}">${s.medicals.length}</td><td>${a.phones}</td><td class="muted">${ago(s.at)}</td>`
      : `<td colspan="8" class="muted">No online copy yet (needs the newest Adal Keep and its chat signed in)</td>`}
      <td class="${a.backup?.error ? 'num bad' : !a.backup?.at ? 'muted' : (Date.now() - new Date(a.backup.at)) > 3 * 864e5 ? 'num warn' : ''}">${a.backup?.at ? ago(a.backup.at) : 'none yet'}${a.backup?.error ? ' ⚠' : ''}</td>
      <td class="${!a.health?.version?.sha ? 'muted' : a.latest && a.health.version.sha !== a.latest ? 'num warn' : ''}" title="${a.latest ? `Published: ${a.latest}` : ''}">${a.health?.version?.sha ? esc(a.health.version.sha) + (a.latest && a.health.version.sha === a.latest ? ' ✓' : '') : a.health ? 'old' : '—'}</td>
      <td><button class="go" data-open="${a.id}">Open Adal Keep</button></td></tr>` }).join('') + '</table>'
  const a = work.find(x => x.id === workOpen)
  if (a?.summary) {
    const s = a.summary
    const runRow = (r, failed) => `<div class="row2"><div class="grow"><b>${esc(r.name || `profile ${r.profile_id}`)}</b> · ${esc(wf(r.workflow))} <span class="muted">${ago(r.at)}</span>
        <div class="why" title="${esc(r.reason)}">${esc(r.reason || '')}</div></div>
      <button class="ghost" data-goto="/profiles/${r.profile_id}?run=${r.id}">Open</button>
      ${failed ? '' : `<button class="ghost" data-act="resume" data-run="${r.id}">Continue</button><button class="ghost" data-act="cancel" data-run="${r.id}">Cancel</button>`}</div>`
    html += `<div class="detail">
      <div class="box2"><h4>⏸ Waiting for a person (${s.runs.paused + s.runs.pending})</h4>${s.waiting.map(r => runRow(r, false)).join('') || '<p class="muted">Nothing waiting.</p>'}</div>
      <div class="box2"><h4>❌ Failed this week (${s.runs.failed7d})</h4>${s.failed.map(r => runRow(r, true)).join('') || '<p class="muted">No failures.</p>'}</div>
      <div class="box2"><h4>📋 Open tasks (${s.tasks.open})</h4>${s.tasks.latest.map(t => `<div class="row2"><div class="grow">${esc(t.title)} <span class="muted">${ago(t.created_at)}</span></div>
        ${t.profile_id ? `<button class="ghost" data-goto="/profiles/${t.profile_id}">Open</button>` : ''}<button class="ghost" data-task="${t.id}">Done</button></div>`).join('') || '<p class="muted">No open tasks.</p>'}
        <form id="addTask" style="display:flex;gap:6px;margin-top:8px"><input type="text" id="taskT" placeholder="Give this agency a task…" style="flex:1;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)"><button class="go">Add</button></form></div>
      <div class="box2"><h4>🩺 Medicals running out (${s.medicals.length})</h4>${s.medicals.map(m => `<div class="row2"><div class="grow"><b>${esc(m.name)}</b></div>
        <span class="${m.days <= 3 ? 'num bad' : 'num warn'}">${m.days < 0 ? 'expired' : `${m.days} days`}</span><button class="ghost" data-goto="/profiles/${m.id}">Open</button></div>`).join('') || '<p class="muted">None within 14 days.</p>'}
        <h4 style="margin-top:14px">🧭 Where its profiles stand</h4><div class="stages">${Object.entries(s.stages || {}).sort((x, y) => y[1] - x[1]).map(([k, v]) => `<span>${esc(k.replace(/_/g, ' '))} · ${v}</span>`).join('')}</div></div>
    </div>`
  }
  if (a?.health) {
    const h = a.health, lag = h.event_loop_lag_ms || {}
    const ram = h.pc?.total_mb ? `${(h.pc.total_mb / 1024).toFixed(0)} GB RAM, ${(h.pc.free_mb / 1024).toFixed(1)} GB free` : ''
    html += `<div class="detail"><div class="box2"><h4>🖥 Their PC <span class="muted" style="font-weight:400">${ago(h.at)}</span></h4>
      <p>${esc(h.os || '')} · ${esc(h.pc?.cpu_model || '')} (${h.pc?.cpus || '?'} cores) · ${ram}</p>
      <p>Browser: <b>${esc(h.browser || '?')}</b> · Adal Keep ${esc(h.version?.sha || 'version unknown')}${a.latest && h.version?.sha && h.version.sha !== a.latest ? ` <span class="num warn">(newest is ${esc(a.latest)})</span>` : ''} · running ${h.uptime_min ?? '?'} min</p>
      <p>Server: <span class="${h.node_cpu_pct > 50 ? 'num bad' : h.node_cpu_pct > 20 ? 'num warn' : ''}">${h.node_cpu_pct ?? '?'}% CPU</span> · ${h.node_mem_mb ?? '?'} MB · delay <span class="${lag.p99 > 200 ? 'num bad' : lag.p99 > 50 ? 'num warn' : ''}">${lag.mean ?? '?'} ms (worst ${lag.max ?? '?'} ms)</span> · ${h.requests_5min ?? '?'} requests / 5 min</p>
      ${h.slowest?.length ? `<p class="muted" style="font-size:12px">Slowest: ${h.slowest.map(esc).join(' · ')}</p>` : ''}
      <h4 style="margin-top:10px">⚠ Last errors (${h.errors?.length || 0})</h4>
      ${(h.errors || []).slice().reverse().map(e => `<div class="why" style="font-size:12px">${ago(e.at)}${e.times > 1 ? ` ×${e.times}` : ''} — ${esc(e.line)}</div>`).join('') || '<p class="muted">None.</p>'}
    </div></div>`
  }
  if (a) {
    const b = a.backup || {}, dl = downloads[a.id]
    html += `<div class="detail"><div class="box2"><h4>💾 Backup</h4>
      <p>${b.at ? `Newest: <b>${new Date(b.at).toLocaleString()}</b> (${ago(b.at)}) · ${b.files_sent ?? '?'} of ${b.files_total ?? '?'} documents` : '<span class="muted">No backup yet — it runs by itself every day in the lunch break once the PC has the newest Adal Keep. Press "Back up now" to start one.</span>'}</p>
      ${b.error ? `<p class="num bad" style="font-size:12px">Last try failed ${ago(b.error_at)}: ${esc(b.error)}</p>` : ''}
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
        <button class="go" data-bk="run">Back up now</button>
        <button class="ghost" data-bk="status">How is it going?</button>
        ${b.at ? `<button class="ghost" data-bk="restore">Restore on its PC</button>
        <button class="ghost" data-bk="restoreTo">Restore onto another PC…</button>
        <button class="ghost" data-bk="download">Download everything to this PC</button>` : ''}
      </div>
      ${dl ? `<p style="font-size:12px;margin-top:8px">${dl.error ? `<span class="num bad">Download failed: ${esc(dl.error)}</span>` : dl.done ? `✅ Saved ${dl.files} documents + the database in <span class="code" style="letter-spacing:0">${esc(dl.dir)}</span>` : `⏳ Downloading — ${esc(dl.step)} · ${dl.files} documents so far`}</p>` : ''}
    </div></div>`
  }
  $('#table').innerHTML = html
  const T = $('#table')
  T.querySelectorAll('[data-bk]').forEach(btn => btn.onclick = async () => {
    const k = btn.dataset.bk, ag = a
    try {
      if (k === 'run') { await api('/api/backup-run', { agency: ag.id }); tell('Backing up', 'It runs on their PC now; the newest time shows here when it is done.') }
      else if (k === 'status') {
        const r = await api('/api/backup-status', { agency: ag.id })
        const p = r.progress || {}, j = r.job || {}
        tell('Backup on their PC', p.running ? `Working: ${p.step || ''} ${p.files_todo ? `· ${p.files_done}/${p.files_todo} documents` : ''}`
          : j.running ? `${j.kind} working…` : j.error ? `Last ${j.kind} failed: ${j.error}` : j.result ? `Last ${j.kind} done.` : `Idle · ${r.files_sent} of ${r.files_total} documents backed up.`)
      }
      else if (k === 'restore') {
        if (!(await ask({ title: `Restore ${ag.name}?`, text: 'Their PC gets back every document from the newest backup and its database as it was then (the current one is kept as a copy). Adal Keep restarts on that PC.', ok: 'Restore', danger: true }))) return
        await api('/api/backup-restore', { from: ag.id }); tell('Restoring', 'It runs on their PC now and restarts it when done.')
      }
      else if (k === 'restoreTo') {
        const others = work.filter(x => x.id !== ag.id)
        const pick = await ask({ title: `Put ${ag.name}'s backup on another PC`, text: 'For a new or replaced PC: install Adal Keep there first (it shows up here as an agency). Type its PC number:', ok: 'Restore there', danger: true, input: '' })
        if (!pick) return
        const to = others.find(x => String(x.pc_number) === String(pick).trim())
        if (!to) return tell('Not found', `No agency PC with number ${pick}.`)
        await api('/api/backup-restore', { from: ag.id, to: to.id }); tell('Restoring', `${ag.name}'s data goes onto PC ${to.pc_number} now; it restarts when done.`)
      }
      else if (k === 'download') {
        downloads[ag.id] = await api('/api/backup-download', { agency: ag.id }); showTable()
        const poll = setInterval(async () => {
          downloads[ag.id] = await api(`/api/backup-download?agency=${ag.id}`, null, 'GET').catch(() => downloads[ag.id])
          if (!downloads[ag.id]?.running) clearInterval(poll)
          if (tab === 'work') showTable()
        }, 2000)
      }
    } catch (err) { tell('Not done', err.message) }
  })
  T.querySelectorAll('[data-need]').forEach(d => d.onclick = () => { workOpen = d.dataset.need; showTable(); renderList() })
  T.querySelectorAll('[data-row]').forEach(r => r.onclick = (e) => { if (e.target.closest('button')) return; workOpen = r.dataset.row; showTable(); renderList() })
  T.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openAgency(b.dataset.open))
  T.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => openAgency(workOpen, b.dataset.goto))
  const call = async (method, path, body, done) => {
    if (!a.pcOnline && !(await ask({ title: "The agency's PC is off", text: 'It is done when that PC is on again… if it is on within 30 seconds. Try anyway?', ok: 'Try' }))) return
    try { await api('/api/agency-call', { agency: workOpen, method, path, body }); tell('Done', done) } catch (err) { tell('Not done', err.message) }
  }
  T.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    if (b.dataset.act === 'cancel' && !(await ask({ title: 'Cancel this run?', text: 'It stops; the agency can start it again later.', ok: 'Cancel the run', danger: true }))) return
    call('POST', `/automations/${b.dataset.run}/${b.dataset.act}`, {}, b.dataset.act === 'resume' ? 'The run goes on on their PC.' : 'The run was cancelled.')
  })
  T.querySelectorAll('[data-task]').forEach(b => b.onclick = () => call('PATCH', `/tasks/${b.dataset.task}`, { status: 'completed' }, 'The task is done.'))
  const f = $('#addTask'); if (f) f.onsubmit = (e) => { e.preventDefault(); const t = $('#taskT').value.trim(); if (t) call('POST', '/tasks', { title: t, description: 'From Adal support', type: 'manual', priority: 'high' }, 'The task is on their Tasks page.') }
}

// ------------------------------------------------------------ the panel --
// What was seen last time shows at once (kept on this PC), then the fresh copy.
const KEEP = (k, v) => { try { localStorage.setItem('adm:' + k, JSON.stringify(v)) } catch {} }
const KEPT = (k) => { try { return JSON.parse(localStorage.getItem('adm:' + k) || 'null') } catch { return null } }
let toastT = null
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = 'none' }, 5000) }
const initials = (n) => String(n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase()
const mains = () => (data.mains || []).filter(a => !query || `${a.name} ${a.pc_number}`.toLowerCase().includes(query))
const workOf = (a) => work.find(w => w.id === a.id || (w.pc_number && w.pc_number === a.pc_number)) || {}
let query = '', pageOf = null, pageData = null, agShownHtml = ''

// Agencies: one card per PC — what each has, at a glance.
function agenciesView() {
  if (pageOf) return agencyPage(pageOf)
  const list = mains()
  $('#title').textContent = `Agencies — ${list.length}`
  const inv = data.invites
  const html = `<div class="agrid">${list.map(a => {
    const w = workOf(a), s = w.summary
    return `<div class="acard" data-pc="${esc(a.pc_number || a.id)}">
      <div class="top"><div class="av">${esc(initials(a.name))}</div>
        <div style="min-width:0"><div class="nm">${esc(a.name)}</div>
        <div class="sub"><span class="dot ${w.pcOnline ? 'on' : ''}"></span>${w.pcOnline ? 'PC on' : `PC off${w.pcSeen ? ' · ' + ago(w.pcSeen) : ''}`} · <span class="code" style="letter-spacing:.05em">${esc(a.pc_number || '')}</span></div></div>
        <span class="plantag ${esc(s?.plan || '')}">${esc(s?.plan || '—')}</span></div>
      <div class="nums"><div><b>${s ? s.profiles : '—'}</b><span>profiles</span></div><div><b>${s ? s.chosen : '—'}</b><span>chosen</span></div><div><b class="${s ? cls(s.runs.paused + s.runs.pending, 5, 15) : ''}">${s ? s.runs.paused + s.runs.pending : '—'}</b><span>waiting</span></div></div>
      ${a.banned ? '<div style="margin-top:10px"><span class="pill rejected">banned</span></div>' : ''}
    </div>` }).join('') || '<p class="muted">No agency yet.</p>'}</div>
    <h4>Add an agency by its PC number</h4>
    <form class="addform" id="addf">
      <input type="text" id="addPc" placeholder="PC number" inputmode="numeric" maxlength="7" autocomplete="off">
      <input type="text" id="addName" placeholder="Agency name" autocomplete="off">
      <label class="muted"><input type="checkbox" id="addPaid"> paid (unlocks)</label>
      <button class="go">Add agency</button>
    </form>
    ${inv && inv.length ? `<table><tr><th>PC number</th><th>Name</th><th>Status</th><th>Paid</th><th>Unlock code now</th><th></th></tr>` +
      inv.map(i => `<tr><td class="code">${esc(i.pc_number)}</td><td><b>${esc(i.name)}</b></td>
        <td>${i.joined ? '<span class="pill approved">installed</span>' : '<span class="pill pending">not installed yet</span>'}</td>
        <td><label><input type="checkbox" data-paid="${i.pc_number}" ${i.paid ? 'checked' : ''}> ${i.paid ? 'paid — unlocked' : 'not paid'}</label></td>
        <td class="code">${i.code || '—'}</td><td><button class="ghost" data-uninvite="${i.pc_number}">Remove</button></td></tr>`).join('') + '</table>' : ''}`
  // Redrawn only when something changed: a click is never lost under a redraw.
  if (html === agShownHtml && $('#table .agrid')) return
  agShownHtml = html
  $('#table').innerHTML = html
  $('#table').querySelectorAll('.acard').forEach(c => c.onclick = () => { pageOf = c.dataset.pc; pageData = KEPT('agency:' + pageOf); agencyPage(pageOf) })
  $('#addf').onsubmit = async (e) => {
    e.preventDefault()
    try { await api('/api/invite', { pc: $('#addPc').value, name: $('#addName').value, paid: $('#addPaid').checked }); refresh() } catch (err) { tell('Not added', err.message) }
  }
  $('#table').querySelectorAll('[data-paid]').forEach(c => c.onchange = async () => {
    if (c.checked && !(await ask({ title: 'Mark as paid?', text: `PC ${c.dataset.paid} unlocks for good the next time it is online.`, ok: 'Mark paid' }))) { c.checked = false; return }
    await api('/api/invite-paid', { pc: c.dataset.paid, paid: c.checked }); refresh()
  })
  $('#table').querySelectorAll('[data-uninvite]').forEach(b => b.onclick = async () => {
    if (await ask({ title: 'Remove from your list?', text: `PC ${b.dataset.uninvite}. An installed agency stays installed.`, ok: 'Remove', danger: true })) { await api('/api/invite-delete', { pc: b.dataset.uninvite }); refresh() }
  })
}

          <h4 style="margin-top:14px">Where the profiles stand</h4><div class="stages">${Object.entries(s?.stages || {}).map(([k, v]) => `<span>${esc(k)} · ${v}</span>`).join('') || '<span class="muted">—</span>'}</div></div>
        <div class="box2"><h4>Waiting for a person (${(s?.waiting || []).length})</h4>${(s?.waiting || []).slice(0, 12).map(r => `<div class="row2"><span class="grow"><b>${esc(r.name || '#' + r.profile_id)}</b> · ${esc(wf(r.workflow))}<div class="why">${esc(r.reason || '')}</div></span><span class="muted">${ago(r.at)}</span></div>`).join('') || '<p class="muted">Nothing waiting.</p>'}</div>
        <div class="box2"><h4>Failed this week (${(s?.failed || []).length})</h4>${(s?.failed || []).slice(0, 12).map(r => `<div class="row2"><span class="grow"><b>${esc(r.name || '#' + r.profile_id)}</b> · ${esc(wf(r.workflow))}<div class="why">${esc(r.reason || '')}</div></span><span class="muted">${ago(r.at)}</span></div>`).join('') || '<p class="muted">No failures.</p>'}</div>
        <div class="box2"><h4>Medicals ending soon</h4>${(s?.medicals || []).slice(0, 12).map(m => `<div class="row2"><span class="grow">${esc(m.name)}</span><span class="${m.days <= 7 ? 'num bad' : 'num warn'}">${m.days} d</span></div>`).join('') || '<p class="muted">None within 14 days.</p>'}</div>
        <div class="box2"><h4>Receipts</h4>${A.receipts.map(r => `<div class="row2"><span class="grow">${when(r.created_at)}</span><span class="pill ${r.status}">${r.status}</span></div>`).join('') || '<p class="muted">No receipts yet.</p>'}
          <h4 style="margin-top:14px">Phones</h4>${A.phones.map(p => `<div class="row2"><span class="grow">${esc(p.name || 'Phone')}</span><span class="muted">since ${new Date(p.since).toLocaleDateString()}</span></div>`).join('') || '<p class="muted">No phone paired.</p>'}</div>
      </div></div>`
    $('#aOpen').onclick = () => openAgency(A.id)
    if ($('#aChat')) $('#aChat').onclick = () => { const c = data.conversations.find(x => x.id === A.inbox); if (c) { switchTab('inbox'); openConv(c) } }
    $('#aPlan').onclick = () => { switchTab('plans') }
    $('#aBackup').onclick = async () => { try { const r = await api('/api/backup-run', { agency: A.id }); if (!r.queued) toast(`${A.name}: backing up now`) } catch (e) { tell('Not done', e.message) } }
    if ($('#aBan')) $('#aBan').onclick = async () => { if (await ask({ title: `Ban ${A.name}?`, text: 'It can no longer write in Everyone or private chats (it can still write to you).', ok: 'Ban', danger: true })) { await api('/api/ban-pc', { pc: A.pc_number, id: A.id, banned: true }); agencyPage(pc) } }
    if ($('#aUnban')) $('#aUnban').onclick = async () => { await api('/api/ban-pc', { pc: A.pc_number, id: A.id, banned: false }); agencyPage(pc) }
    $('#aDel').onclick = async () => {
      if (!(await ask({ title: `Delete ${A.name}?`, text: `Its account${A.accounts > 1 ? 's (all ' + A.accounts + ')' : ''}, chats, receipts and pictures are removed for good. If that PC opens the chat again it comes back as a new agency.`, ok: 'Delete', danger: true }))) return
      try { await api('/api/delete-pc', { pc: A.pc_number, id: A.id }); pageOf = null; refresh(); agenciesView() } catch (e) { tell('Not deleted', e.message) }
    }
    $('#table').querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => { await api('/api/waiting/cancel', { id: b.dataset.cancel }); agencyPage(pc) })
  }
  if (pageData && pageOf === pc) paint(pageData)
  else $('#table').innerHTML = '<p class="muted">Loading…</p>'
  if (!fresh) return
  try {
    const A = await api('/api/agency?' + (/^\d{6}$/.test(pc) ? 'pc=' : 'id=') + encodeURIComponent(pc))
    KEEP('agency:' + pc, A)
    if (JSON.stringify(A) !== JSON.stringify(pageData)) { pageData = A; paint(A) }
  } catch (e) { if (!pageData) $('#table').innerHTML = `<p class="muted">${esc(e.message)}</p>` }
}

function switchTab(t) { const b = document.querySelector(`.tabs button[data-tab="${t}"]`); if (b) b.click() }

function showTable() {
  $('#thread').style.display = 'none'; $('#compose').style.display = 'none'; $('#table').style.display = 'block'
  if (tab === 'work') return workTable()
  if (tab === 'agents') return agentsView()
  if (tab === 'ceos') return ceosView()
  if (tab === 'plans') return plansView()
  if (tab === 'cvt') return cvtView()
  if (tab === 'payments') {
    $('#title').textContent = 'Payment receipts'
    $('#table').innerHTML = `<table><tr><th>Receipt</th><th>Agency</th><th>PC number</th><th>Sent</th><th>Status</th><th></th></tr>` +
      data.requests.map(r => `<tr><td>${img(r.image_path).replace('<img', '<img style="max-height:70px;border-radius:6px"')}</td>
        <td>${esc(r.agency)}</td><td class="code">${esc(r.pc_number)}</td><td>${when(r.created_at)}</td>
        <td><span class="pill ${r.status}">${r.status}</span>${r.note ? `<div class="muted">${esc(r.note)}</div>` : ''}</td>
        <td>${r.status === 'pending' ? `<button class="go" data-ok="${r.id}">Approve — unlock</button> <button class="ghost" data-no="${r.id}">Reject</button>`
          : r.code ? `<span class="muted">code now:</span> <span class="code">${r.code}</span>` : ''}</td></tr>`).join('') + '</table>'
    $('#table').querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => {
      if (!(await ask({ title: 'Approve this payment?', text: 'That PC unlocks for good within a minute.', ok: 'Approve — unlock' }))) return
      await api('/api/decide', { id: b.dataset.ok, approve: true }); refresh()
    })
    $('#table').querySelectorAll('[data-no]').forEach(b => b.onclick = async () => {
      const note = await ask({ title: 'Reject this receipt', text: 'Why? (the agency sees this)', ok: 'Reject', danger: true, input: 'The receipt is not readable' })
      if (note === null) return
      await api('/api/decide', { id: b.dataset.no, approve: false, note }); refresh()
    })
  } else if (tab === 'agencies') {
    return agenciesView()
  } else {
    $('#title').textContent = 'Agencies'
    const inv = data.invites
    $('#table').innerHTML = `
      <form class="addform" id="addf">
        <input type="text" id="addPc" placeholder="PC number" inputmode="numeric" maxlength="7" autocomplete="off">
        <input type="text" id="addName" placeholder="Agency name" autocomplete="off">
        <label class="muted"><input type="checkbox" id="addPaid"> paid (unlocks)</label>
        <button class="go">Add agency</button>
      </form>
      ${inv === null ? '<p class="muted">To add agencies by PC number, run <b>supabase/schema.sql</b> once more in Supabase (SQL Editor).</p>' : ''}
      ${inv && inv.length ? `<h4>Added by you (${inv.length})</h4><table><tr><th>PC number</th><th>Name</th><th>Status</th><th>Paid</th><th>Unlock code now</th><th></th></tr>` +
        inv.map(i => `<tr><td class="code">${esc(i.pc_number)}</td><td><b>${esc(i.name)}</b></td>
          <td>${i.joined ? '<span class="pill approved">installed</span>' : '<span class="pill pending">not installed yet</span>'}</td>
          <td><label><input type="checkbox" data-paid="${i.pc_number}" ${i.paid ? 'checked' : ''}> ${i.paid ? 'paid — unlocked' : 'not paid'}</label></td>
          <td class="code">${i.code || '—'}</td>
          <td><button class="ghost" data-uninvite="${i.pc_number}">Remove</button></td></tr>`).join('') + '</table>' : ''}
      <h4>Installed agencies (${data.agencies.filter(a => !a.is_admin).length})</h4>
      <table><tr><th>Agency</th><th>PC number</th><th>Unlock code now</th><th>Joined</th><th>Last seen</th><th></th></tr>` +
      data.agencies.filter(a => !a.is_admin).map(a => `<tr><td><b>${esc(a.name)}</b>${a.banned ? ' <span class="pill rejected">banned</span>' : ''}</td>
        <td class="code">${esc(a.pc_number || '—')}</td><td class="code">${a.code || '—'}</td><td>${when(a.created_at)}</td><td>${when(a.last_seen)}</td>
        <td style="white-space:nowrap">${a.banned ? `<button class="ghost" data-unban="${a.id}">Unban</button>` : `<button class="danger" data-ban="${a.id}">Ban</button>`}
        <button class="go" onclick="openAgency('${a.id}')">Open Adal Keep</button> <button class="ghost" data-del="${a.id}">Delete</button></td></tr>`).join('') + '</table>' +
      '<p class="muted">Ban: the agency can no longer write in Everyone or private chats (it can still write to you). Delete: removes the agency with its chats, receipts and pictures — if that PC opens the chat again it comes back as a new agency.</p>'
    $('#addf').onsubmit = async (e) => {
      e.preventDefault()
      try {
        await api('/api/invite', { pc: $('#addPc').value, name: $('#addName').value, paid: $('#addPaid').checked })
        refresh()
      } catch (err) { tell('Not added', err.message) }
    }
    $('#table').querySelectorAll('[data-paid]').forEach(c => c.onchange = async () => {
      if (c.checked && !(await ask({ title: 'Mark as paid?', text: `PC ${c.dataset.paid} unlocks for good the next time it is online.`, ok: 'Mark paid' }))) { c.checked = false; return }
      await api('/api/invite-paid', { pc: c.dataset.paid, paid: c.checked }); refresh()
    })
    $('#table').querySelectorAll('[data-uninvite]').forEach(b => b.onclick = async () => {
      if (await ask({ title: 'Remove from your list?', text: `PC ${b.dataset.uninvite}. An installed agency stays installed; it only leaves this list.`, ok: 'Remove', danger: true })) { await api('/api/invite-delete', { pc: b.dataset.uninvite }); refresh() }
    })
    $('#table').querySelectorAll('[data-ban]').forEach(b => b.onclick = async () => {
      if (await ask({ title: `Ban ${name(b.dataset.ban)}?`, text: 'It can no longer write in Everyone or private chats.', ok: 'Ban', danger: true })) { await api('/api/ban', { id: b.dataset.ban, banned: true }); refresh() }
    })
    $('#table').querySelectorAll('[data-unban]').forEach(b => b.onclick = async () => { await api('/api/ban', { id: b.dataset.unban, banned: false }); refresh() })
    $('#table').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!(await ask({ title: `Delete ${name(b.dataset.del)}?`, text: 'Its account, chats, receipts and pictures are removed for good.', ok: 'Delete', danger: true }))) return
      try { await api('/api/delete-agency', { id: b.dataset.del }); refresh() } catch (err) { tell('Not deleted', err.message) }
    })
  }
}

$('#compose').onsubmit = async (e) => {
  e.preventDefault()
  const body = $('#text').value.trim()
  if (!body || !open) return
  await api('/api/send', { conversation: open.id, body }).catch(err => tell('Not sent', err.message))
  $('#text').value = ''; loadMessages()
}
$('#pic').onchange = () => {
  const f = $('#pic').files[0]; if (!f || !open) return
  const r = new FileReader(); r.onload = async () => { await api('/api/send', { conversation: open.id, image: r.result }); loadMessages() }; r.readAsDataURL(f)
  $('#pic').value = ''
}

let synced = 0
async function refresh() {
  try {
    data = await api('/api/overview'); KEEP('overview', data)
    work = await api('/api/work').catch(() => work); KEEP('work', work)
    synced = Date.now(); $('#sync').className = ''; $('#sync').textContent = '● synced'
    if (open) open = data.conversations.find(c => c.id === open.id) || open
    renderList()
    if (tab === 'work') { if (!document.querySelector('#table input:focus')) showTable() }
    else if (tab === 'cvt') { if (!cvtDragged) cvtView() }
    else if (tab === 'ceos') { if (!document.querySelector('#table input:focus')) ceosView() }
    else if (tab === 'agents') { if (!dragged && !document.querySelector('#table input:focus, #table select:focus')) agentsView() }
    else if (tab === 'agencies') { if (!document.querySelector('#table input:focus')) { if (pageOf) agencyPage(pageOf); else agenciesView() } }
    else if (tab === 'payments') showTable()
    else await loadMessages()
    const waiting = data.requests.filter(r => r.status === 'pending').length
    document.title = (waiting ? `(${waiting}) ` : '') + 'Adal Keep Admin'
    document.querySelector('[data-tab=payments]').innerHTML = `<span class="ic">💳</span>Payments${waiting ? `<span class="count">${waiting}</span>` : ''}`
    const unread = data.conversations.filter(c => c.kind === 'admin').reduce((n, c) => n + (c.unread || 0), 0)
    document.querySelector('[data-tab=inbox]').innerHTML = `<span class="ic">💬</span>Inbox${unread ? `<span class="count">${unread}</span>` : ''}`
  } catch (e) { $('#sync').className = 'off'; $('#sync').textContent = synced ? `● offline — last synced ${ago(synced)} ago` : '● cannot reach Supabase: ' + e.message }
}
// Open at once with what was seen last time; the fresh copy follows.
data = KEPT('overview') || data; work = KEPT('work') || work
$('#search').oninput = (e) => { query = e.target.value.trim().toLowerCase(); pageOf = null; if (tab !== 'agencies') switchTab('agencies'); else agenciesView() }
showTable(); renderList(); refresh(); setInterval(refresh, 5000)
</script>
</body>
</html>
