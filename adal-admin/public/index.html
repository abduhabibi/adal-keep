<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adal Keep Admin</title>
<style>
  :root { --bg:#f4f6f8; --panel:#fff; --line:#e3e8ee; --text:#14212b; --muted:#64748b; --teal:#0f766e; --teal-soft:#e6f4f2; --red:#dc2626; --amber:#b45309; --mine:#d9f2ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1419; --panel:#141e25; --line:#24323c; --text:#e5edf2; --muted:#8aa0ae; --teal-soft:#123532; --mine:#163d39; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; }
  nav { width:300px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  nav header { padding:16px; font-weight:700; font-size:16px; border-bottom:1px solid var(--line); }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; padding:8px; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:0; background:transparent; color:var(--muted); padding:7px 6px; border-radius:8px; cursor:pointer; font-weight:600; font-size:12px; }
  .tabs button.on { background:var(--teal-soft); color:var(--teal); }
  .list { overflow-y:auto; flex:1; }
  .item { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:8px; align-items:center; }
  .item:hover, .item.on { background:var(--teal-soft); }
  .item .t { font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .s { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { background:var(--teal); color:#fff; border-radius:999px; font-size:11px; padding:1px 7px; font-weight:700; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  main > header { padding:14px 18px; background:var(--panel); border-bottom:1px solid var(--line); font-weight:700; }
  #thread { flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:70%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:7px 10px; align-self:flex-start; }
  .msg.mine { align-self:flex-end; background:var(--mine); }
  .msg .who { font-size:11px; font-weight:700; color:var(--teal); }
  .msg .time { font-size:10px; color:var(--muted); text-align:right; }
  .msg img { max-width:260px; max-height:260px; border-radius:8px; display:block; margin-top:4px; cursor:zoom-in; }
  .msg .del { font-size:10px; color:var(--red); cursor:pointer; margin-left:8px; }
  form#compose { display:flex; gap:8px; padding:12px 18px; background:var(--panel); border-top:1px solid var(--line); }
  form#compose input[type=text] { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button.go { background:var(--teal); color:#fff; border:0; border-radius:10px; padding:9px 16px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:5px 10px; cursor:pointer; }
  button.danger { background:var(--red); color:#fff; border:0; border-radius:8px; padding:5px 10px; cursor:pointer; }
  table { width:100%; border-collapse:collapse; background:var(--panel); }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:11px; text-transform:uppercase; color:var(--muted); }
  .wrap { padding:16px 18px; overflow:auto; flex:1; }
  .code { font-family:ui-monospace, monospace; font-weight:700; letter-spacing:.15em; }
  .pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .pending { background:#fef3c7; color:var(--amber); } .approved { background:#d1fae5; color:#047857; } .rejected { background:#fee2e2; color:var(--red); }
  .muted { color:var(--muted); }
  #dlg { position:fixed; inset:0; background:#0009; display:none; align-items:center; justify-content:center; z-index:50; }
  #dlg .box { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; width:min(420px,92vw); }
  #dlg h3 { margin:0 0 6px; } #dlg p { margin:0 0 12px; color:var(--muted); }
  #dlg input { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:12px; }
  #dlg .row { display:flex; gap:8px; justify-content:flex-end; }
  .addform { display:grid; grid-template-columns:140px 1fr auto auto; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:16px; }
  .addform input[type=text] { padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  h4 { margin:18px 0 8px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card b { font-size:24px; display:block; } .card span { color:var(--muted); font-size:12px; }
  .card.warn b { color:var(--amber); } .card.bad b { color:var(--red); }
  tr.ag { cursor:pointer; } tr.ag:hover, tr.ag.on { background:var(--teal-soft); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:#94a3b8; } .dot.on { background:#16a34a; }
  .num.warn { color:var(--amber); font-weight:700; } .num.bad { color:var(--red); font-weight:700; }
  .detail { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; margin-top:14px; }
  .box2 { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0; }
  .box2 h4 { margin:0 0 8px; } .row2 { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .row2:last-child { border:0; } .row2 .grow { flex:1; min-width:0; } .row2 .why { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stages { display:flex; flex-wrap:wrap; gap:6px; } .stages span { background:var(--teal-soft); color:var(--teal); border-radius:999px; padding:2px 9px; font-size:12px; font-weight:600; }
  #zoom { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; cursor:zoom-out; }
  #zoom img { max-width:92vw; max-height:92vh; }
</style>
</head>
<body>
<nav>
  <header>Adal Keep — Admin</header>
  <div class="tabs">
    <button data-tab="work" class="on">Work</button>
    <button data-tab="inbox">Inboxes</button>
    <button data-tab="chats">All chats</button>
    <button data-tab="payments">Payments</button>
    <button data-tab="agencies">Agencies</button>
  </div>
  <div class="list" id="list"></div>
</nav>
<main>
  <header id="title">Choose a chat</header>
  <div id="thread"></div>
  <div class="wrap" id="table" style="display:none"></div>
  <form id="compose" style="display:none">
    <input type="file" id="pic" accept="image/*" hidden>
    <button type="button" class="ghost" onclick="pic.click()" title="Send a picture">📎</button>
    <input type="text" id="text" placeholder="Write to the agency… (links are not allowed)" autocomplete="off">
    <button class="go">Send</button>
  </form>
</main>
<div id="zoom" onclick="this.style.display='none'"><img alt=""></div>
<div id="dlg"><div class="box"><h3 id="dlgT"></h3><p id="dlgP"></p><input id="dlgI" type="text" style="display:none"><div class="row"><button class="ghost" id="dlgNo">Cancel</button><button class="go" id="dlgOk">OK</button></div></div></div>
<script>
let data = { agencies: [], conversations: [], requests: [] }
let tab = 'work', open = null, lastId = 0, work = [], workOpen = null
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const when = (t) => new Date(t).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })
const api = async (p, body) => {
  const r = await fetch(p, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j
}
// The panel's own questions: the browser's confirm() can be switched off
// ("Don't allow localhost:4100 to ask again") and then silently says No.
function ask({ title, text = '', ok = 'OK', danger = false, input = null }) {
  return new Promise(resolve => {
    $('#dlgT').textContent = title; $('#dlgP').textContent = text
    const I = $('#dlgI'); I.style.display = input === null ? 'none' : 'block'; I.value = input ?? ''
    const okB = $('#dlgOk'); okB.textContent = ok; okB.className = danger ? 'danger' : 'go'
    const done = (v) => { $('#dlg').style.display = 'none'; resolve(v) }
    okB.onclick = () => done(input === null ? true : I.value)
    $('#dlgNo').onclick = () => done(input === null ? false : null)
    $('#dlgNo').style.display = ok === 'Close' ? 'none' : ''
    $('#dlg').style.display = 'flex'
    ;(input === null ? okB : I).focus()
  })
}
const tell = (title, text) => ask({ title, text, ok: 'Close' })
const name = (id) => data.agencies.find(a => a.id === id)?.name || 'agency'
const img = (p) => `<img src="/api/image?path=${encodeURIComponent(p)}" onclick="event.stopPropagation(); zoom.querySelector('img').src=this.src; zoom.style.display='flex'">`

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b))
  if (tab === 'payments' || tab === 'agencies' || tab === 'work') { open = null; showTable() } else renderList()
  renderList()
})

function renderList() {
  const L = $('#list')
  if (tab === 'inbox' || tab === 'chats') {
    const convs = data.conversations.filter(c => tab === 'inbox' ? c.kind === 'admin' : c.kind !== 'admin')
    L.innerHTML = convs.map(c => `<div class="item ${open?.id === c.id ? 'on' : ''}" data-id="${c.id}">
      <div style="min-width:0;flex:1"><div class="t">${esc(c.title)}</div>
      <div class="s">${c.last ? esc(c.last.body || '📷 picture') : '<span class="muted">no messages yet</span>'}</div></div>
      ${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</div>`).join('') || '<p class="muted" style="padding:14px">Nothing yet.</p>'
    L.querySelectorAll('.item').forEach(el => el.onclick = () => openConv(data.conversations.find(c => c.id === el.dataset.id)))
  } else if (tab === 'work') {
    L.innerHTML = work.map(a => `<div class="item ${workOpen === a.id ? 'on' : ''}" data-w="${a.id}"><span class="dot ${a.pcOnline ? 'on' : ''}"></span>
      <div style="min-width:0;flex:1"><div class="t">${esc(a.name)}</div><div class="s">${a.summary ? `${a.summary.profiles} profiles · ${a.summary.runs.paused + a.summary.runs.pending} waiting` : 'no online copy yet'}</div></div>
      ${a.summary && (a.summary.runs.paused + a.summary.tasks.open) ? `<span class="badge">${a.summary.runs.paused + a.summary.tasks.open}</span>` : ''}</div>`).join('') || '<p class="muted" style="padding:14px">No agencies yet.</p>'
    L.querySelectorAll('[data-w]').forEach(el => el.onclick = () => { workOpen = el.dataset.w; showTable(); renderList() })
  } else if (tab === 'payments') {
    const p = data.requests.filter(r => r.status === 'pending').length
    L.innerHTML = `<p style="padding:14px">${p} receipt(s) waiting.</p>`
  } else {
    L.innerHTML = `<p style="padding:14px">${data.agencies.filter(a => !a.is_admin).length} agencies installed Adal Keep.</p>`
  }
}

async function openConv(c) {
  open = c; lastId = 0
  $('#title').textContent = c.title + (c.kind === 'admin' ? ' — inbox with Adal' : c.kind === 'group' ? ' — all agencies' : ' — private chat')
  $('#thread').style.display = 'flex'; $('#table').style.display = 'none'
  $('#compose').style.display = c.kind === 'direct' ? 'none' : 'flex' // Adal reads private chats, writes in inboxes and Everyone
  $('#thread').innerHTML = ''
  await loadMessages(); renderList()
}

async function loadMessages() {
  if (!open) return
  const list = await api(`/api/messages?conversation=${open.id}`)
  const T = $('#thread'), atBottom = T.scrollHeight - T.scrollTop - T.clientHeight < 60
  T.innerHTML = list.map(m => `<div class="msg ${m.sender_id === data.adminId ? 'mine' : ''}">
    <div class="who">${esc(m.sender_id === data.adminId ? 'You (Adal Keep)' : name(m.sender_id))}<span class="del" data-id="${m.id}">delete</span></div>
    ${m.body ? `<div>${esc(m.body)}</div>` : ''}${m.image_path ? img(m.image_path) : ''}
    <div class="time">${when(m.created_at)}</div></div>`).join('') || '<p class="muted">No messages yet.</p>'
  T.querySelectorAll('.del').forEach(d => d.onclick = async () => { if (await ask({ title: 'Delete this message?', text: 'It disappears for everyone.', ok: 'Delete', danger: true })) { await api('/api/delete-message', { id: d.dataset.id }); loadMessages() } })
  const newest = list.at(-1)?.id || 0
  if (atBottom || newest !== lastId) T.scrollTop = T.scrollHeight
  lastId = newest
}

// One agency's own Adal Keep, in its own window (served on :4101).
function openAgency(id, to = '') {
  const a = work.find(x => x.id === id) || data.agencies.find(x => x.id === id) || {}
  const url = `http://localhost:${Number(location.port) + 1}/?agency=${id}&name=${encodeURIComponent(a.name || '')}${to ? `&to=${encodeURIComponent(to)}` : ''}`
  window.open(url, `agency-${id}`, 'popup,width=1280,height=860')
}
const WF = { musaned_add_candidate: 'Musaned', musaned_check_chosen: 'Musaned check', wafid_book: 'Wafid booking', wafid_check: 'Wafid result', wafid_slip: 'Wafid slip',
  lmis_contract: 'LMIS contract', insurance_certificate: 'Insurance', mofa_visa: 'Visa', cv_generate: 'CV' }
const wf = (w) => WF[w] || String(w || '').replace(/_/g, ' ')
const ago = (t) => { if (!t) return '—'; const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? 'now' : m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d` }
const cls = (n, warn, bad) => n >= bad ? 'num bad' : n >= warn ? 'num warn' : 'num'

function workTable() {
  $('#title').textContent = "Agencies' work — every agency, live"
  const S = work.map(a => a.summary).filter(Boolean)
  const sum = (f) => S.reduce((n, s) => n + (f(s) || 0), 0)
  const cards = [
    ['Agencies with PC on', `${work.filter(a => a.pcOnline).length} / ${work.length}`, ''],
    ['Runs waiting for a person', sum(s => s.runs.paused + s.runs.pending), sum(s => s.runs.paused) > 10 ? 'warn' : ''],
    ['Failed this week', sum(s => s.runs.failed7d), sum(s => s.runs.failed7d) ? 'bad' : ''],
    ['Open tasks', sum(s => s.tasks.open), ''],
    ['Medicals ending ≤ 7 days', sum(s => s.medicals.filter(m => m.days <= 7).length), sum(s => s.medicals.filter(m => m.days <= 7).length) ? 'bad' : ''],
    ['Profiles', sum(s => s.profiles), ''], ['Chosen by employers', sum(s => Number(s.chosen)), ''],
  ]
  let html = `<div class="cards">${cards.map(([t, v, c]) => `<div class="card ${c}"><b>${v}</b><span>${t}</span></div>`).join('')}</div>
    <table><tr><th>Agency</th><th>PC</th><th>Profiles</th><th>Chosen</th><th>Waiting</th><th>Failed 7 d</th><th>Tasks</th><th>Medical ≤ 14 d</th><th>Phones</th><th>Copied</th><th></th></tr>` +
    work.map(a => { const s = a.summary; return `<tr class="ag ${workOpen === a.id ? 'on' : ''}" data-row="${a.id}">
      <td><b>${esc(a.name)}</b> <span class="muted code" style="letter-spacing:0">${esc(a.pc_number || '')}</span>${a.branchPCs?.length ? `<div class="muted" style="font-size:11px">+ ${a.branchPCs.length} PC(s) following it: ${a.branchPCs.join(', ')}</div>` : ''}${a.banned ? ' <span class="pill rejected">banned</span>' : ''}</td>
      <td><span class="dot ${a.pcOnline ? 'on' : ''}"></span>${a.pcOnline ? 'on' : `off ${a.pcSeen ? ago(a.pcSeen) : ''}`}</td>
      ${s ? `<td>${s.profiles}</td><td>${s.chosen}</td><td class="${cls(s.runs.paused + s.runs.pending, 5, 15)}">${s.runs.paused + s.runs.pending}</td>
      <td class="${cls(s.runs.failed7d, 1, 5)}">${s.runs.failed7d}</td><td class="${cls(s.tasks.open, 5, 20)}">${s.tasks.open}</td>
      <td class="${cls(s.medicals.length, 1, 3)}">${s.medicals.length}</td><td>${a.phones}</td><td class="muted">${ago(s.at)}</td>`
      : `<td colspan="8" class="muted">No online copy yet (needs the newest Adal Keep and its chat signed in)</td>`}
      <td><button class="go" data-open="${a.id}">Open Adal Keep</button></td></tr>` }).join('') + '</table>'
  const a = work.find(x => x.id === workOpen)
  if (a?.summary) {
    const s = a.summary
    const runRow = (r, failed) => `<div class="row2"><div class="grow"><b>${esc(r.name || `profile ${r.profile_id}`)}</b> · ${esc(wf(r.workflow))} <span class="muted">${ago(r.at)}</span>
        <div class="why" title="${esc(r.reason)}">${esc(r.reason || '')}</div></div>
      <button class="ghost" data-goto="/profiles/${r.profile_id}?run=${r.id}">Open</button>
      ${failed ? '' : `<button class="ghost" data-act="resume" data-run="${r.id}">Continue</button><button class="ghost" data-act="cancel" data-run="${r.id}">Cancel</button>`}</div>`
    html += `<div class="detail">
      <div class="box2"><h4>⏸ Waiting for a person (${s.runs.paused + s.runs.pending})</h4>${s.waiting.map(r => runRow(r, false)).join('') || '<p class="muted">Nothing waiting.</p>'}</div>
      <div class="box2"><h4>❌ Failed this week (${s.runs.failed7d})</h4>${s.failed.map(r => runRow(r, true)).join('') || '<p class="muted">No failures.</p>'}</div>
      <div class="box2"><h4>📋 Open tasks (${s.tasks.open})</h4>${s.tasks.latest.map(t => `<div class="row2"><div class="grow">${esc(t.title)} <span class="muted">${ago(t.created_at)}</span></div>
        ${t.profile_id ? `<button class="ghost" data-goto="/profiles/${t.profile_id}">Open</button>` : ''}<button class="ghost" data-task="${t.id}">Done</button></div>`).join('') || '<p class="muted">No open tasks.</p>'}
        <form id="addTask" style="display:flex;gap:6px;margin-top:8px"><input type="text" id="taskT" placeholder="Give this agency a task…" style="flex:1;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)"><button class="go">Add</button></form></div>
      <div class="box2"><h4>🩺 Medicals running out (${s.medicals.length})</h4>${s.medicals.map(m => `<div class="row2"><div class="grow"><b>${esc(m.name)}</b></div>
        <span class="${m.days <= 3 ? 'num bad' : 'num warn'}">${m.days < 0 ? 'expired' : `${m.days} days`}</span><button class="ghost" data-goto="/profiles/${m.id}">Open</button></div>`).join('') || '<p class="muted">None within 14 days.</p>'}
        <h4 style="margin-top:14px">🧭 Where its profiles stand</h4><div class="stages">${Object.entries(s.stages || {}).sort((x, y) => y[1] - x[1]).map(([k, v]) => `<span>${esc(k.replace(/_/g, ' '))} · ${v}</span>`).join('')}</div></div>
    </div>`
  }
  $('#table').innerHTML = html
  const T = $('#table')
  T.querySelectorAll('[data-row]').forEach(r => r.onclick = (e) => { if (e.target.closest('button')) return; workOpen = r.dataset.row; showTable(); renderList() })
  T.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openAgency(b.dataset.open))
  T.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => openAgency(workOpen, b.dataset.goto))
  const call = async (method, path, body, done) => {
    if (!a.pcOnline && !(await ask({ title: "The agency's PC is off", text: 'It is done when that PC is on again… if it is on within 30 seconds. Try anyway?', ok: 'Try' }))) return
    try { await api('/api/agency-call', { agency: workOpen, method, path, body }); tell('Done', done) } catch (err) { tell('Not done', err.message) }
  }
  T.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    if (b.dataset.act === 'cancel' && !(await ask({ title: 'Cancel this run?', text: 'It stops; the agency can start it again later.', ok: 'Cancel the run', danger: true }))) return
    call('POST', `/automations/${b.dataset.run}/${b.dataset.act}`, {}, b.dataset.act === 'resume' ? 'The run goes on on their PC.' : 'The run was cancelled.')
  })
  T.querySelectorAll('[data-task]').forEach(b => b.onclick = () => call('PATCH', `/tasks/${b.dataset.task}`, { status: 'completed' }, 'The task is done.'))
  const f = $('#addTask'); if (f) f.onsubmit = (e) => { e.preventDefault(); const t = $('#taskT').value.trim(); if (t) call('POST', '/tasks', { title: t, description: 'From Adal support', type: 'manual', priority: 'high' }, 'The task is on their Tasks page.') }
}

function showTable() {
  $('#thread').style.display = 'none'; $('#compose').style.display = 'none'; $('#table').style.display = 'block'
  if (tab === 'work') return workTable()
  if (tab === 'payments') {
    $('#title').textContent = 'Payment receipts'
    $('#table').innerHTML = `<table><tr><th>Receipt</th><th>Agency</th><th>PC number</th><th>Sent</th><th>Status</th><th></th></tr>` +
      data.requests.map(r => `<tr><td>${img(r.image_path).replace('<img', '<img style="max-height:70px;border-radius:6px"')}</td>
        <td>${esc(r.agency)}</td><td class="code">${esc(r.pc_number)}</td><td>${when(r.created_at)}</td>
        <td><span class="pill ${r.status}">${r.status}</span>${r.note ? `<div class="muted">${esc(r.note)}</div>` : ''}</td>
        <td>${r.status === 'pending' ? `<button class="go" data-ok="${r.id}">Approve — unlock</button> <button class="ghost" data-no="${r.id}">Reject</button>`
          : r.code ? `<span class="muted">code now:</span> <span class="code">${r.code}</span>` : ''}</td></tr>`).join('') + '</table>'
    $('#table').querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => {
      if (!(await ask({ title: 'Approve this payment?', text: 'That PC unlocks for good within a minute.', ok: 'Approve — unlock' }))) return
      await api('/api/decide', { id: b.dataset.ok, approve: true }); refresh()
    })
    $('#table').querySelectorAll('[data-no]').forEach(b => b.onclick = async () => {
      const note = await ask({ title: 'Reject this receipt', text: 'Why? (the agency sees this)', ok: 'Reject', danger: true, input: 'The receipt is not readable' })
      if (note === null) return
      await api('/api/decide', { id: b.dataset.no, approve: false, note }); refresh()
    })
  } else {
    $('#title').textContent = 'Agencies'
    const inv = data.invites
    $('#table').innerHTML = `
      <form class="addform" id="addf">
        <input type="text" id="addPc" placeholder="PC number" inputmode="numeric" maxlength="7" autocomplete="off">
        <input type="text" id="addName" placeholder="Agency name" autocomplete="off">
        <label class="muted"><input type="checkbox" id="addPaid"> paid (unlocks)</label>
        <button class="go">Add agency</button>
      </form>
      ${inv === null ? '<p class="muted">To add agencies by PC number, run <b>supabase/schema.sql</b> once more in Supabase (SQL Editor).</p>' : ''}
      ${inv && inv.length ? `<h4>Added by you (${inv.length})</h4><table><tr><th>PC number</th><th>Name</th><th>Status</th><th>Paid</th><th>Unlock code now</th><th></th></tr>` +
        inv.map(i => `<tr><td class="code">${esc(i.pc_number)}</td><td><b>${esc(i.name)}</b></td>
          <td>${i.joined ? '<span class="pill approved">installed</span>' : '<span class="pill pending">not installed yet</span>'}</td>
          <td><label><input type="checkbox" data-paid="${i.pc_number}" ${i.paid ? 'checked' : ''}> ${i.paid ? 'paid — unlocked' : 'not paid'}</label></td>
          <td class="code">${i.code || '—'}</td>
          <td><button class="ghost" data-uninvite="${i.pc_number}">Remove</button></td></tr>`).join('') + '</table>' : ''}
      <h4>Installed agencies (${data.agencies.filter(a => !a.is_admin).length})</h4>
      <table><tr><th>Agency</th><th>PC number</th><th>Unlock code now</th><th>Joined</th><th>Last seen</th><th></th></tr>` +
      data.agencies.filter(a => !a.is_admin).map(a => `<tr><td><b>${esc(a.name)}</b>${a.banned ? ' <span class="pill rejected">banned</span>' : ''}</td>
        <td class="code">${esc(a.pc_number || '—')}</td><td class="code">${a.code || '—'}</td><td>${when(a.created_at)}</td><td>${when(a.last_seen)}</td>
        <td style="white-space:nowrap">${a.banned ? `<button class="ghost" data-unban="${a.id}">Unban</button>` : `<button class="danger" data-ban="${a.id}">Ban</button>`}
        <button class="go" onclick="openAgency('${a.id}')">Open Adal Keep</button> <button class="ghost" data-del="${a.id}">Delete</button></td></tr>`).join('') + '</table>' +
      '<p class="muted">Ban: the agency can no longer write in Everyone or private chats (it can still write to you). Delete: removes the agency with its chats, receipts and pictures — if that PC opens the chat again it comes back as a new agency.</p>'
    $('#addf').onsubmit = async (e) => {
      e.preventDefault()
      try {
        await api('/api/invite', { pc: $('#addPc').value, name: $('#addName').value, paid: $('#addPaid').checked })
        refresh()
      } catch (err) { tell('Not added', err.message) }
    }
    $('#table').querySelectorAll('[data-paid]').forEach(c => c.onchange = async () => {
      if (c.checked && !(await ask({ title: 'Mark as paid?', text: `PC ${c.dataset.paid} unlocks for good the next time it is online.`, ok: 'Mark paid' }))) { c.checked = false; return }
      await api('/api/invite-paid', { pc: c.dataset.paid, paid: c.checked }); refresh()
    })
    $('#table').querySelectorAll('[data-uninvite]').forEach(b => b.onclick = async () => {
      if (await ask({ title: 'Remove from your list?', text: `PC ${b.dataset.uninvite}. An installed agency stays installed; it only leaves this list.`, ok: 'Remove', danger: true })) { await api('/api/invite-delete', { pc: b.dataset.uninvite }); refresh() }
    })
    $('#table').querySelectorAll('[data-ban]').forEach(b => b.onclick = async () => {
      if (await ask({ title: `Ban ${name(b.dataset.ban)}?`, text: 'It can no longer write in Everyone or private chats.', ok: 'Ban', danger: true })) { await api('/api/ban', { id: b.dataset.ban, banned: true }); refresh() }
    })
    $('#table').querySelectorAll('[data-unban]').forEach(b => b.onclick = async () => { await api('/api/ban', { id: b.dataset.unban, banned: false }); refresh() })
    $('#table').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!(await ask({ title: `Delete ${name(b.dataset.del)}?`, text: 'Its account, chats, receipts and pictures are removed for good.', ok: 'Delete', danger: true }))) return
      try { await api('/api/delete-agency', { id: b.dataset.del }); refresh() } catch (err) { tell('Not deleted', err.message) }
    })
  }
}

$('#compose').onsubmit = async (e) => {
  e.preventDefault()
  const body = $('#text').value.trim()
  if (!body || !open) return
  await api('/api/send', { conversation: open.id, body }).catch(err => tell('Not sent', err.message))
  $('#text').value = ''; loadMessages()
}
$('#pic').onchange = () => {
  const f = $('#pic').files[0]; if (!f || !open) return
  const r = new FileReader(); r.onload = async () => { await api('/api/send', { conversation: open.id, image: r.result }); loadMessages() }; r.readAsDataURL(f)
  $('#pic').value = ''
}

async function refresh() {
  try {
    data = await api('/api/overview')
    work = await api('/api/work').catch(() => work)
    if (open) open = data.conversations.find(c => c.id === open.id) || open
    renderList()
    if (tab === 'work') { if (!document.querySelector('#table input:focus')) showTable() }
    else if (tab === 'payments' || tab === 'agencies') showTable()
    else await loadMessages()
    const waiting = data.requests.filter(r => r.status === 'pending').length
    document.title = (waiting ? `(${waiting}) ` : '') + 'Adal Keep Admin'
    document.querySelector('[data-tab=payments]').textContent = waiting ? `Payments (${waiting})` : 'Payments'
  } catch (e) { $('#title').textContent = 'Cannot reach Supabase: ' + e.message }
}
showTable(); refresh(); setInterval(refresh, 5000)
</script>
</body>
</html>
