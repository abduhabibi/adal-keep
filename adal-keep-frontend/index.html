<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Adal Keep</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/adal-logo.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        var t = 'light';
        try { t = localStorage.getItem('adal-theme') || 'light'; } catch (e) {}
        if (t !== 'dark' && t !== 'gradient') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
        // Tailwind's dark: styles need the class too, or dark pages get dark text.
        if (t !== 'light') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
