<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cinzel:wght@500&display=swap">
<style>body{margin:0;background:#fff;display:flex}svg{width:600px;height:600px;display:block}</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <g id="book"><path d="M-3 14 C-14 6 -30 3 -46 4 V-12 C-30 -13 -14 -10 -3 -2 Z M3 14 C14 6 30 3 46 4 V-12 C30 -13 14 -10 3 -2 Z"/></g>
 <g id="lines"><path d="M-3 21 C-14 13 -30 10 -49 11 M3 21 C14 13 30 10 49 11" fill="none" stroke-width="2.4" stroke-linecap="round"/></g>
</defs></svg>

<!-- A: line globe + calligraphy + book -->
<svg viewBox="0 0 300 300">
 <rect width="300" height="300" fill="#fff"/>
 <g fill="none" stroke="#B8913A" stroke-width="1.6">
  <circle cx="150" cy="104" r="62"/>
  <ellipse cx="150" cy="104" rx="26" ry="62"/><ellipse cx="150" cy="104" rx="50" ry="62"/>
  <path d="M88 104 H212 M96 72 H204 M96 136 H204"/>
 </g>
 <text x="150" y="190" text-anchor="middle" font-family="'Aref Ruqaa',serif" font-weight="700" font-size="56" fill="#0B5440" stroke="#fff" stroke-width="6" paint-order="stroke">زاد القرآن</text>
 <g transform="translate(150 218)"><use href="#book" fill="#0B5440"/><use href="#lines" stroke="#B8913A"/></g>
 <text x="150" y="268" text-anchor="middle" font-family="Cinzel,serif" font-weight="500" font-size="15" letter-spacing="5" fill="#0B5440">ZADUL QUR'AN</text>
</svg>

<!-- B: calligraphy hero -->
<svg viewBox="0 0 300 300">
 <rect width="300" height="300" fill="#fff"/>
 <g transform="translate(150 58)" fill="#B8913A"><rect x="-9" y="-9" width="18" height="18"/><rect x="-9" y="-9" width="18" height="18" transform="rotate(45)"/><circle r="4" fill="#fff"/></g>
 <text x="150" y="160" text-anchor="middle" font-family="'Aref Ruqaa',serif" font-weight="700" font-size="76" fill="#13294B">زاد القرآن</text>
 <g transform="translate(150 194) scale(.9)"><use href="#book" fill="#B8913A"/><use href="#lines" stroke="#13294B"/></g>
 <text x="150" y="250" text-anchor="middle" font-family="Cinzel,serif" font-weight="500" font-size="15" letter-spacing="6" fill="#13294B">ZADUL QUR'AN</text>
</svg>

<!-- C: emblem -->
<svg viewBox="0 0 300 300">
 <rect width="300" height="300" fill="#fff"/>
 <defs><path id="ring" d="M150 150 m-112 0 a112 112 0 1 1 224 0 a112 112 0 1 1 -224 0"/></defs>
 <circle cx="150" cy="150" r="132" fill="none" stroke="#B8913A" stroke-width="2.5"/>
 <circle cx="150" cy="150" r="94" fill="none" stroke="#B8913A" stroke-width="1.2"/>
 <text font-family="Cinzel,serif" font-weight="500" font-size="15" letter-spacing="4" fill="#0B5440"><textPath href="#ring" startOffset="25%" text-anchor="middle">ONLINE QUR'AN SCHOOL</textPath></text>
 <text x="150" y="262" text-anchor="middle" font-family="Cinzel,serif" font-weight="500" font-size="12" letter-spacing="3" fill="#0B5440">ZADUL QUR'AN</text>
 <g transform="translate(150 92)" fill="#B8913A"><rect x="-6" y="-6" width="12" height="12"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"/></g>
 <text x="150" y="154" text-anchor="middle" font-family="'Aref Ruqaa',serif" font-weight="700" font-size="46" fill="#0B5440">زاد القرآن</text>
 <g transform="translate(150 190) scale(.8)"><use href="#book" fill="#B8913A"/><use href="#lines" stroke="#0B5440"/></g>
</svg>
</body></html>
